
name: Gerar APK VR Box Games

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Instalar ferramentas
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Baixar projeto
        run: |
          pip install gdown
          gdown --fuzzy "https://drive.google.com/file/d/1Rt-sTEZy2nRHlJER5q-iG-M8iSVhCUu5/view" -O projeto.zip
          unzip -q projeto.zip -d projeto

      - name: Compilar
        run: |
          cd projeto/VR-Box-Games-Android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: VR-Box-Games-APK
          path: projeto/VR-Box-Games-Android/**/build/outputs/apk/debug/*.apk

